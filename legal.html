<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241323"><link rel="icon" type="image/png" href="./assets/relymio-logo.png"><title>Relymio — Legal</title><link rel="stylesheet" href="./styles.css"><style>.legal-page{max-width:820px;padding-top:72px;padding-bottom:90px}.legal-page h1{margin:0;font-family:Georgia,serif;font-size:clamp(42px,6vw,68px);line-height:1;letter-spacing:-.06em}.legal-updated{margin:16px 0 52px;color:#9a8991;font-size:12px}.legal-body{display:grid;gap:28px}.legal-body section{padding:24px 0;border-top:1px solid var(--line)}.legal-body h2{margin:0 0 9px;font-family:Georgia,serif;font-size:25px;letter-spacing:-.035em}.legal-body p{max-width:760px;margin:0;color:var(--muted);font-size:15px;line-height:1.7}.legal-logo{width:34px;height:34px;border-radius:11px;object-fit:cover;box-shadow:0 7px 16px rgba(93,26,70,.18)}</style></head>
<body data-site-page="legal">
  <header class="site-header"><a class="brand" href="./index.html"><img class="legal-logo" src="./assets/relymio-logo.png" alt=""><span>relymio</span></a><nav class="nav-links"><a href="./index.html#how" data-i18n="nav.how">How it works</a><a href="./index.html#plans" data-i18n="nav.plans">Free & Pro</a><a href="./screens.html" data-i18n="nav.screens">App screens</a></nav><button class="language-toggle" type="button" data-language-toggle>FR</button></header>
  <main class="section-shell legal-page"><p class="eyebrow" data-legal-label>LEGAL</p><h1 data-legal-title>Privacy Policy</h1><p class="legal-updated" data-legal-updated>Last updated: November 17, 2026.</p><div class="legal-body" data-legal-body></div></main>
  <footer class="site-footer section-shell"><div class="footer-brand"><a class="brand" href="./index.html"><img class="legal-logo" src="./assets/relymio-logo.png" alt=""><span>relymio</span></a><p data-i18n="footer.tagline">Find the words. Keep yourself in the conversation.</p></div><div class="footer-links"><a href="./screens.html" data-i18n="nav.screens">App screens</a><a href="./legal.html?doc=terms" data-i18n="footer.terms">Terms of Use</a><a href="./legal.html?doc=privacy" data-i18n="footer.privacy">Privacy Policy</a><a href="./legal.html?doc=notice" data-i18n="footer.notice">Legal Notice</a><a href="mailto:support@djabelsolutions.fr" data-i18n="footer.support">Support</a></div><p class="copyright">© 2026 Djabel Solutions · Relymio</p></footer>
  <script src="./site.js" defer></script>
  <script>
  const LEGAL={
    en:{privacy:{label:'PRIVACY',title:'Privacy Policy',sections:[['Data controller','Djabel Solutions. Contact: support@djabelsolutions.fr.'],['At a glance','You can use Relymio without an account. Your first name, age range, onboarding answers, personal wording, progress, completed situations, saved phrases and settings are stored locally on your device. We do not sell your data. Free-text answers are not sent to a generative AI model.'],['Data stored on your device','Your local data may include your first name, age range, onboarding answers, personal wording, completed situations, saved phrases and settings. They are used to operate and personalise the app. You can erase local data by deleting the app, or through in-app settings when that option is available.'],['Optional analytics','Only with explicit consent, structured usage events such as onboarding steps, situation starts and completions may be sent to our analytics provider. They must not include your name, answers, personal wording, conversation content or email. You can withdraw consent in Settings.'],['Purchases','When subscriptions are available, Apple or Google processes payment. RevenueCat may receive a technical identifier and subscription status to determine whether Relymio Pro is active. Djabel Solutions does not receive your payment details.'],['Legal basis and retention','App operation and subscription management are based on performance of the contract. Analytics is based on consent. Local data stay on your device until you delete them.'],['Your rights','Depending on applicable law, you may request access, correction, deletion, restriction, objection or portability, and withdraw consent, by contacting support@djabelsolutions.fr. You may also contact the French data protection authority, CNIL.'],['Age','Relymio is intended for people aged 18 and over. We do not knowingly collect data from minors.']]},terms:{label:'TERMS',title:'Terms of Use',sections:[['1. Service','Relymio is a communication practice app. It provides pre-written situations, possible wording and reflections. The content is deterministic; the app does not use generative artificial intelligence. Relymio does not provide care, diagnosis, or medical, psychological or legal advice.'],['2. Eligibility and access','The app is intended for people aged 18 and over. You can use it as a guest. Free includes one short situation per day and up to five saved phrases. Pro includes multi-turn simulations, guided paths, reviews and unlimited saved phrases when offered in the store.'],['3. Subscription','The store displays the plan, price, currency, term, renewal and any trial before purchase; those store terms control. Payment is processed by Apple or Google. The subscription renews automatically unless cancelled at least 24 hours before the current period ends. Store rules and applicable law govern management, cancellation and refunds.'],['4. Return offer','A return offer may appear after the paywall is closed. It is optional and its final price is the price displayed by the store at purchase. Relymio does not simulate purchases when a real store package is not configured.'],['5. Restoring purchases','You can restore an existing subscription from the subscription screen using Restore Purchases and the same store account.'],['6. Ownership and liability','Relymio’s text, scenarios, illustrations, brand and logo are protected. Use is personal and non-commercial. The service is provided “as is” and no particular outcome in a real conversation is guaranteed.'],['7. Changes','These terms may change. The latest update date appears on this page and significant changes will be notified in the app.'],['8. Contact and governing law','Publisher: Djabel Solutions. Contact: support@djabelsolutions.fr. These terms are governed by French law without limiting mandatory consumer protections.']]},notice:{label:'LEGAL NOTICE',title:'Legal Notice',sections:[['Publisher','Djabel Solutions. Support email: support@djabelsolutions.fr.'],['Hosting','The website is published through GitHub Pages. Planned public URL: https://relymio.djabelsolutions.fr.'],['Intellectual property','Relymio content, scenarios, illustrations, brand and logo are protected. Unauthorised reproduction is prohibited.']]}}
    ,fr:{privacy:{label:'CONFIDENTIALITÉ',title:'Politique de confidentialité',sections:[['Responsable du traitement','Djabel Solutions. Contact : support@djabelsolutions.fr.'],['En bref','Tu peux utiliser Relymio sans compte. Ton prénom, ta tranche d’âge, tes réponses d’onboarding, ta phrase personnelle, ta progression, tes situations terminées, tes phrases gardées et tes réglages restent sur ton appareil. Nous ne vendons pas tes données. Les textes libres ne sont pas envoyés à un modèle d’IA générative.'],['Données sur ton appareil','Les données locales peuvent inclure ton prénom, ta tranche d’âge, tes réponses d’onboarding, ta phrase personnelle, les situations terminées, tes phrases gardées et tes réglages. Elles servent au fonctionnement et à la personnalisation de l’app. Tu peux les effacer en supprimant l’app, ou depuis les réglages quand cette option est disponible.'],['Analytics optionnelles','Avec ton accord explicite uniquement, des événements structurés comme les étapes d’onboarding, les débuts et fins de situations peuvent être envoyés à notre outil de mesure. Ils ne doivent pas contenir ton prénom, tes réponses, ta phrase personnelle, le contenu d’une conversation ou ton email. Tu peux retirer ton accord dans les Réglages.'],['Achats','Lorsque les abonnements seront disponibles, Apple ou Google traitera le paiement. RevenueCat peut recevoir un identifiant technique et l’état de l’abonnement pour déterminer si Relymio Pro est actif. Djabel Solutions ne reçoit pas tes coordonnées bancaires.'],['Base légale et conservation','Le fonctionnement de l’app et la gestion de l’abonnement reposent sur l’exécution du contrat. Les analytics reposent sur ton consentement. Les données locales restent sur ton appareil jusqu’à leur suppression.'],['Tes droits','Selon le droit applicable, tu peux demander l’accès, la rectification, l’effacement, la limitation, l’opposition ou la portabilité de tes données, et retirer ton consentement, en écrivant à support@djabelsolutions.fr. Tu peux également contacter la CNIL.'],['Âge','Relymio est destiné aux personnes de 18 ans et plus. Nous ne collectons pas sciemment les données de mineurs.']]},terms:{label:'CGU',title:'Conditions générales d’utilisation',sections:[['1. Service','Relymio est une application d’entraînement à la communication. Elle propose des situations écrites à l’avance, des formulations possibles et des débriefs. Les contenus sont déterministes ; l’app n’utilise pas d’intelligence artificielle générative. Relymio ne fournit ni soin, ni diagnostic, ni conseil médical, psychologique ou juridique.'],['2. Accès','L’application est destinée aux personnes de 18 ans et plus. Tu peux l’utiliser en invité. Free comprend une situation courte par jour et jusqu’à cinq phrases gardées. Pro comprend les simulations multi-tours, les parcours guidés, les révisions et les phrases gardées sans limite lorsqu’il est proposé dans le store.'],['3. Abonnement','Le store affiche la formule, le prix, la devise, la durée, le renouvellement et l’éventuel essai avant l’achat ; ces informations font foi. Le paiement est traité par Apple ou Google. L’abonnement se renouvelle automatiquement sauf résiliation au moins 24 heures avant la fin de la période en cours. La gestion, la résiliation et les remboursements suivent les règles du store et du droit applicable.'],['4. Offre de retour','Une offre de retour peut apparaître après la fermeture du paywall. Elle est facultative et son prix définitif est celui affiché par le store au moment de l’achat. Relymio ne simule aucun achat lorsqu’aucun vrai package store n’est configuré.'],['5. Restauration','Tu peux restaurer un abonnement existant depuis l’écran d’abonnement avec « Restaurer mes achats » et le même compte store.'],['6. Propriété et responsabilité','Les textes, scénarios, illustrations, marque et logo Relymio sont protégés. L’usage est personnel et non commercial. Le service est fourni « en l’état » ; aucun résultat particulier dans une conversation réelle n’est garanti.'],['7. Modifications','Ces conditions peuvent évoluer. La date de mise à jour figure sur cette page et les changements importants seront signalés dans l’app.'],['8. Contact et droit applicable','Éditeur : Djabel Solutions. Contact : support@djabelsolutions.fr. Ces conditions sont régies par le droit français, sans limiter les protections impératives du consommateur.']]},notice:{label:'MENTIONS LÉGALES',title:'Mentions légales',sections:[['Éditeur','Djabel Solutions. Email de support : support@djabelsolutions.fr.'],['Hébergement','Le site est publié via GitHub Pages. URL publique prévue : https://relymio.djabelsolutions.fr.'],['Propriété intellectuelle','Les contenus, scénarios, illustrations, marque et logo Relymio sont protégés. Toute reproduction non autorisée est interdite.']]}}
  };
  const doc=new URLSearchParams(location.search).get('doc')||'privacy';
  function renderLegal(language){const item=LEGAL[language][doc]||LEGAL[language].privacy;document.querySelector('[data-legal-label]').textContent=item.label;document.querySelector('[data-legal-title]').textContent=item.title;document.querySelector('[data-legal-updated]').textContent=language==='en'?'Last updated: November 17, 2026.':'Dernière mise à jour : 17 novembre 2026.';document.querySelector('[data-legal-body]').innerHTML=item.sections.map(([heading,body])=>`<section><h2>${heading}</h2><p>${body}</p></section>`).join('')}
  window.renderLegal=renderLegal; window.addEventListener('load',()=>renderLegal(localStorage.getItem('relymio-site-language')==='fr'?'fr':'en'));
  </script>
</body></html>
